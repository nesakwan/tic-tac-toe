<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC TOE</title>
    <link rel="stylesheet" href="css/gamestyle.css">
</head>

<body>
    <main id="main-app">
        <div id="gamepage">
            <nav id="game-nav">

                <button id="back-button">
                    ← Accueil
                </button>

                <h1>TIC TAC TOE</h1>

                <button id="settings-button">
                    ⚙
                </button>

            </nav>


            <div id="turn-player"></div>

            <section id="gameplay">

                <div id="game-board">

                    <button id="cell0" class="cell" data-index="0"></button>
                    <button id="cell1" class="cell" data-index="1"></button>
                    <button id="cell2" class="cell" data-index="2"></button>

                    <button id="cell3" class="cell" data-index="3"></button>
                    <button id="cell4" class="cell" data-index="4"></button>
                    <button id="cell5" class="cell" data-index="5"></button>

                    <button id="cell6" class="cell" data-index="6"></button>
                    <button id="cell7" class="cell" data-index="7"></button>
                    <button id="cell8" class="cell" data-index="8"></button>



                </div>

            </section>


            <section id="game-result">

                <div class="score">

                    <div class="score-player">
                        <span class="score-symbol x">Player X</span>
                        <span id="score-x">0</span>
                    </div>

                    <div class="score-draw">
                        <span>Matchs nuls</span>
                        <span id="score-draw">0</span>
                    </div>

                    <div class="score-player">
                        <span class="score-symbol o">Player O</span>
                        <span id="score-o">0</span>
                    </div>

                </div>

                <button id="restart-button">
                    ↻ Rejouer
                </button>

                <div id="end-actions" class="end-actions">
                    <button id="end-replay-button">▶ Replay</button>
                    <button id="end-restart-button">↻ Rejouer</button>
                    <button id="end-change-mode-button">⇄ Changer de mode</button>
                </div>

            </section>


            <div id="replay-panel" class="replay-panel" aria-live="polite">
                <div class="replay-header">
                    <div>
                        <span class="replay-kicker">REPLAY</span>
                        <h2>Revisionnez la partie</h2>
                    </div>
                    <button id="replay-exit-button" class="replay-exit-button" aria-label="Quitter le replay">×</button>
                </div>

                <div class="replay-mode-selector">
                    <label>
                        <input id="replay-mode-action" type="radio" name="replay-mode" value="action" checked>
                        <span>Action par action</span>
                    </label>
                    <label>
                        <input id="replay-mode-turn" type="radio" name="replay-mode" value="turn">
                        <span>Tour par tour</span>
                    </label>
                </div>

                <div class="replay-controls">
                    <button id="replay-start-button">|&lt; Début</button>
                    <button id="replay-prev-button">← Précédent</button>
                    <strong id="replay-progress">Action 0 / 0</strong>
                    <button id="replay-next-button">Suivant →</button>
                    <button id="replay-end-button">Fin &gt;|</button>
                </div>

                <button id="replay-exit-button-bottom" class="replay-quit-button" type="button">Quitter le replay</button>
            </div>


            <div id="result-popup" class="popup-overlay">

                <div class="popup">

                    <button id="close-result-button" class="popup-close" aria-label="Fermer le résultat">×</button>

                    <div id="result-icon">🏆</div>

                    <h2 id="result-title">X A GAGNÉ !</h2>

                    <p id="result-message">Félicitations !</p>

                    <div class="popup-buttons">
                        <button id="popup-restart-button" class="primary-result-action">↻ Rejouer</button>
                        <button id="popup-replay-button">▶ Replay</button>
                        <button id="change-mode-button">⇄ Changer de mode</button>
                        <button id="home-button">⌂ Retour à l'accueil</button>
                    </div>

                </div>

            </div>

        </div>
    </main>
    <script src="js/gamepage.js"></script>
</body>

</html>
